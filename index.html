<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aislado | Mezclador Multitrack</title>
    <style>
        :root {
            --border-rack: #343a40;    
            --text-light: #ffffff;     
            --text-muted: #adb5bd;    
            --cyan-led: #00fff0;       
            --success-green: #10b981;  
            --danger-red: #ef4444;
            --warning: #ffb703;
            --daw-bg: #151719;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: #212529;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* --- CONTENEDOR DAW AISLADO --- */
        .daw-container {
            background-color: var(--daw-bg);
            border: 2px solid var(--border-rack);
            border-radius: 8px;
            padding: 20px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            color: var(--text-light);
        }

        .daw-title {
            font-size: 0.9rem;
            color: var(--cyan-led);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0 0 5px 0;
            font-weight: bold;
            text-align: center;
        }

        .daw-subtitle {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
            margin: 0 0 20px 0;
        }

        .daw-master-controls {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 1px dashed var(--border-rack);
            padding-bottom: 15px;
        }

        .btn-master {
            background-color: #343a40;
            border: 1px solid #495057;
            color: white;
            padding: 10px 28px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            margin-bottom: 15px;
            width: 100%;
            max-width: 250px;
        }
        .btn-master:hover { background-color: #495057; }
        .btn-master.playing { background-color: var(--success-green); border-color: #1ea867; }

        .timeline-container {
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 400px;
            margin: 0 auto;
            font-size: 0.8rem;
            color: var(--text-muted);
            font-family: monospace;
        }

        .progress-slider {
            -webkit-appearance: none;
            flex-grow: 1;
            height: 6px;
            background: #2a2e33;
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

        .progress-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--cyan-led);
            cursor: pointer;
        }

        .progress-slider::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--cyan-led);
            cursor: pointer;
            border: none;
        }

        .daw-channel {
            display: flex;
            flex-direction: column;
            background: #1d2023;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 12px;
            border-left: 4px solid #495057;
        }
        
        @media (min-width: 520px) {
            .daw-channel {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
            }
        }

        .daw-channel.ch-stereo { border-left-color: #a855f7; }
        .daw-channel.ch-bass { border-left-color: #ec4899; }
        .daw-channel.ch-click { border-left-color: #f59e0b; }

        .channel-info { flex-grow: 1; text-align: left; margin-bottom: 12px; }
        @media (min-width: 520px) { .channel-info { margin-bottom: 0; } }

        .channel-name { font-size: 0.9rem; font-weight: bold; margin: 0; }
        .channel-track-title { font-size: 0.75rem; color: var(--text-muted); margin: 2px 0 0 0; }

        .channel-controls-group { display: flex; align-items: center; gap: 20px; justify-content: space-between; }

        .pan-container { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; color: var(--text-muted); font-weight: 600; }
        .pan-slider { -webkit-appearance: none; width: 80px; height: 4px; background: #343a40; border-radius: 2px; outline: none; }
        .pan-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--cyan-led); cursor: pointer; }
        .pan-slider::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--cyan-led); cursor: pointer; }

        .channel-buttons { display: flex; gap: 6px; }
        .btn-daw { width: 36px; height: 32px; border: 1px solid #495057; background-color: #2a2e33; color: var(--text-muted); font-weight: bold; font-size: 0.8rem; border-radius: 4px; cursor: pointer; }

        .btn-daw.mute-active { background-color: var(--danger-red); color: white; border-color: var(--danger-red); }
        .btn-daw.solo-active { background-color: var(--warning); color: #000; border-color: var(--warning); }
    </style>
</head>
<body>

    <div class="daw-container">
        <p class="daw-title">🎛️ Mezclador Multitrack Interactivo</p>
        <p class="daw-subtitle">Modifica la mezcla, mutes, solos y paneo estéreo (L/R) en tiempo real.</p>
        
        <div class="daw-master-controls">
            <button class="btn-master" id="dawMasterPlay">▶ REPRODUCIR MIX</button>
            
            <div class="timeline-container">
                <span id="currentTimeLabel">0:00</span>
                <input type="range" id="globalProgressBar" class="progress-slider" min="0" max="100" value="0">
                <span id="totalTimeLabel">0:00</span>
            </div>
        </div>

        <div class="daw-channel ch-stereo">
            <div class="channel-info">
                <p class="channel-name">Stereo Instruments</p>
                <p class="channel-track-title">Eye in the Sky</p>
            </div>
            <div class="channel-controls-group">
                <div class="pan-container">
                    <span>L</span>
                    <input type="range" id="pan-slider-stereo" class="pan-slider" min="-1" max="1" step="0.1" value="0">
                    <span>R</span>
                </div>
                <div class="channel-buttons">
                    <button class="btn-daw" id="mute-stereo">M</button>
                    <button class="btn-daw" id="solo-stereo">S</button>
                </div>
            </div>
        </div>

        <div class="daw-channel ch-bass">
            <div class="channel-info">
                <p class="channel-name">Bass Track</p>
                <p class="channel-track-title">Eye in the Sky</p>
            </div>
            <div class="channel-controls-group">
                <div class="pan-container">
                    <span>L</span>
                    <input type="range" id="pan-slider-bass" class="pan-slider" min="-1" max="1" step="0.1" value="0">
                    <span>R</span>
                </div>
                <div class="channel-buttons">
                    <button class="btn-daw" id="mute-bass">M</button>
                    <button class="btn-daw" id="solo-bass">S</button>
                </div>
            </div>
        </div>

        <div class="daw-channel ch-click">
            <div class="channel-info">
                <p class="channel-name">Click Track</p>
                <p class="channel-track-title">Eye in the Sky</p>
            </div>
            <div class="channel-controls-group">
                <div class="pan-container">
                    <span>L</span>
                    <input type="range" id="pan-slider-click" class="pan-slider" min="-1" max="1" step="0.1" value="0">
                    <span>R</span>
                </div>
                <div class="channel-buttons">
                    <button class="btn-daw" id="mute-click">M</button>
                    <button class="btn-daw" id="solo-click">S</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        const tracks = {
            stereo: { audio: new Audio('audio/eye-stereo.mp3'), mute: false, solo: false, panValue: 0 },
            bass: { audio: new Audio('audio/eye-bass.mp3'), mute: false, solo: false, panValue: 0 },
            click: { audio: new Audio('audio/eye-click.mp3'), mute: false, solo: false, panValue: 0 }
        };

        Object.keys(tracks).forEach(key => {
            tracks[key].audio.loop = true;
            tracks[key].audio.preload = 'auto';
            tracks[key].audio.crossOrigin = 'anonymous';
        });

        let isPlaying = false;
        let isDragging = false;

        const masterPlayBtn = document.getElementById('dawMasterPlay');
        const globalProgressBar = document.getElementById('globalProgressBar');
        const currentTimeLabel = document.getElementById('currentTimeLabel');
        const totalTimeLabel = document.getElementById('totalTimeLabel');

        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
                Object.keys(tracks).forEach(key => {
                    const t = tracks[key];
                    t.source = audioCtx.createMediaElementSource(t.audio);
                    t.panner = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;
                    t.gainNode = audioCtx.createGain();

                    if (t.panner) {
                        t.source.connect(t.panner);
                        t.panner.connect(t.gainNode);
                    } else {
                        t.source.connect(t.gainNode);
                    }
                    t.gainNode.connect(audioCtx.destination);
                });
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function formatTime(secs) {
            if (isNaN(secs) || secs === Infinity) return "0:00";
            let m = Math.floor(secs / 60);
            let s = Math.floor(secs % 60);
            return m + ":" + (s < 10 ? "0" + s : s);
        }

        tracks.stereo.audio.addEventListener('timeupdate', () => {
            const seek = tracks.stereo.audio.currentTime || 0;
            const duration = tracks.stereo.audio.duration || 0;
            currentTimeLabel.textContent = formatTime(seek);
            if (duration > 0) {
                totalTimeLabel.textContent = formatTime(duration);
                if (!isDragging) {
                    globalProgressBar.value = (seek / duration) * 100;
                }
            }
        });

        globalProgressBar.addEventListener('mousedown', () => isDragging = true);
        globalProgressBar.addEventListener('touchstart', () => isDragging = true);
        globalProgressBar.addEventListener('input', (e) => {
            const duration = tracks.stereo.audio.duration || 0;
            if (duration === 0) return;
            const targetTime = (e.target.value / 100) * duration;
            Object.keys(tracks).forEach(key => tracks[key].audio.currentTime = targetTime);
        });
        globalProgressBar.addEventListener('change', () => isDragging = false);
        globalProgressBar.addEventListener('touchend', () => isDragging = false);

        masterPlayBtn.addEventListener('click', () => {
            initAudioContext();
            if (!isPlaying) {
                Promise.all(Object.keys(tracks).map(key => tracks[key].audio.play()))
                    .then(() => {
                        masterPlayBtn.textContent = "⏸ PAUSAR MIX";
                        masterPlayBtn.classList.add('playing');
                        isPlaying = true;
                    })
                    .catch(() => {
                        Object.keys(tracks).forEach(key => tracks[key].audio.play());
                        masterPlayBtn.textContent = "⏸ PAUSAR MIX";
                        masterPlayBtn.classList.add('playing');
                        isPlaying = true;
                    });
            } else {
                Object.keys(tracks).forEach(key => tracks[key].audio.pause());
                masterPlayBtn.textContent = "▶ REPRODUCIR MIX";
                masterPlayBtn.classList.remove('playing');
                isPlaying = false;
            }
        });

        function updateMix() {
            const anySolo = Object.keys(tracks).some(key => tracks[key].solo);
            Object.keys(tracks).forEach(key => {
                const t = tracks[key];
                let shouldVolume = 1;

                if (t.mute) {
                    shouldVolume = 0;
                } else if (anySolo && !t.solo) {
                    shouldVolume = 0;
                }

                if (t.gainNode) {
                    t.gainNode.gain.setValueAtTime(shouldVolume, audioCtx.currentTime);
                } else {
                    t.audio.muted = (shouldVolume === 0);
                }
            });
        }

        function toggleMute(key) {
            tracks[key].mute = !tracks[key].mute;
            document.getElementById(`mute-${key}`).classList.toggle('mute-active', tracks[key].mute);
            updateMix();
        }

        function toggleSolo(key) {
            tracks[key].solo = !tracks[key].solo;
            document.getElementById(`solo-${key}`).classList.toggle('solo-active', tracks[key].solo);
            updateMix();
        }

        function handlePan(key, val) {
            initAudioContext();
            const value = parseFloat(val);
            tracks[key].panValue = value;
            if (tracks[key].panner) {
                tracks[key].panner.pan.setValueAtTime(value, audioCtx.currentTime);
            }
        }

        document.getElementById('mute-stereo').addEventListener('click', () => toggleMute('stereo'));
        document.getElementById('solo-stereo').addEventListener('click', () => toggleSolo('stereo'));
        document.getElementById('pan-slider-stereo').addEventListener('input', (e) => handlePan('stereo', e.target.value));

        document.getElementById('mute-bass').addEventListener('click', () => toggleMute('bass'));
        document.getElementById('solo-bass').addEventListener('click', () => toggleSolo('bass'));
        document.getElementById('pan-slider-bass').addEventListener('input', (e) => handlePan('bass', e.target.value));

        document.getElementById('mute-click').addEventListener('click', () => toggleMute('click'));
        document.getElementById('solo-click').addEventListener('click', () => toggleSolo('click'));
        document.getElementById('pan-slider-click').addEventListener('input', (e) => handlePan('click', e.target.value));
    </script>
</body>
</html>
